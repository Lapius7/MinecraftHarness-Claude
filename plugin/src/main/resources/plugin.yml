name: MinecraftHarness
version: 0.2.0
main: dev.minecraftharness.MinecraftHarnessPlugin
api-version: '1.21'
description: Build in Minecraft by chatting with Claude. Runs on your Claude subscription (claude CLI) or an Anthropic API key.
commands:
  mh:
    description: Claude-powered builder, model switch, undo/reset, film mode, camera rig
    usage: /mh [help|<prompt>|model|effort|key|undo|reset|shift|film|hud|cam|fx|speed|status|stop|claude]
    permission: minecraftharness.use
permissions:
  minecraftharness.use:
    description: Send prompts (/mh <prompt>, !<prompt>) and use undo, shift, film, camera and status
    default: op
  minecraftharness.admin:
    description: Switch model, set the API key, change effort, reset all builds
    default: op
