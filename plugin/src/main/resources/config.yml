# MinecraftHarness
#
# Two ways to talk to Claude:
#   cli/<model>  your Claude subscription, through the official `claude` CLI on this machine
#   api/<model>  an Anthropic API key (Messages API, billed per token)

# Active model. Switch in game with /mh model (needs minecraftharness.admin).
#   cli/opus  cli/sonnet  cli/haiku
#   api/claude-opus-5-5  api/claude-sonnet-5-5  api/claude-haiku-5-5  api/claude-fable-5-2
activeModel: cli/opus

# Effort (how hard Claude works and thinks): low | medium | high | xhigh | max
# Change in game with /mh effort <level> (needs minecraftharness.admin); it is saved here.
# Passed to `claude --effort` (subscription) and to output_config.effort (API).
# The old key `reasoning` is still read when `effort` is missing.
effort: low

# Progress display for the player who sent a prompt, from the moment it is accepted until the reply ends.
# Shows waiting / thinking / answering / running a tool / building, elapsed seconds, and a notice
# when nothing has arrived for 30 seconds.
#   bossbar    a bar at the top of the screen (default)
#   actionbar  one line above the hotbar
#   off        no display (a one-line acknowledgement is sent to chat instead)
# Change in game with /mh progress <bossbar|actionbar|off> (needs minecraftharness.admin).
# Film mode (/mh film on) always hides it.
progress:
  mode: bossbar
  # Who besides the requester sees a subdued "<name> さんが建築中: ..." bar while a build runs.
  #   all (default) / owner (requester only) / off. Players in film mode never see it.
  observers: all
  # When the requester leaves while a prompt runs.
  #   continue (default)  keep running; the result is shown on their next join. Waiting prompts stay too.
  #   stop                cancel the running prompt and drop their waiting ones
  onQuit: continue

# Self-review after a build: Claude inspects the result with the existing tools, fixes problems and
# re-checks. Stops when clean, when worse (the round is undone), or at the round / time / token limit.
# Players change their own level with /mh review <level>; a prompt can add --review <level> once.
# rounds 0 = unlimited (bounded by seconds and tokens).
# Token limits count input + output + cache writes (cache reads are not counted).
review:
  default: light
  levels:
    light:  { rounds: 1, seconds: 300,  tokens: 150000 }
    normal: { rounds: 3, seconds: 600,  tokens: 400000 }
    strict: { rounds: 5, seconds: 1200, tokens: 900000 }
    max:    { rounds: 0, seconds: 3600, tokens: 3000000 }

# Result summary shown in chat after a prompt. /mh detail <off|short|full> changes it per player.
#   short  one line; hover shows everything (default)
#   full   every value
summary:
  detail: short

# Estimated price for API mode only (USD per 1M tokens). Empty = no price shown.
# Subscription (claude CLI) never shows money. Fill in your own model prices, e.g.:
#   claude-sonnet-5-5: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
pricing: {}

# Tone of Claude's replies in game.
#   friendly  a helpful, relaxed tone; after a build it says what it made, offers 2-3 next ideas
#             and invites fixes (default)
#   concise   one or two short sentences, no suggestions
# Applied at startup (restart or /reload after changing).
agent:
  tone: friendly

# Prompts sent while another is running wait their turn, one at a time.
# maxPerPlayer is how many a player may have running + waiting; more are refused.
# Same text as the player's latest prompt is ignored. !now <prompt> or /mh now <prompt> stops the
# player's own running prompt and runs the new one first. /mh stop keeps the waiting ones, /mh stop all clears them.
queue:
  maxPerPlayer: 5

# Maximum tool-calling rounds per prompt (API mode)
maxSteps: 12

anthropic:
  # Prefer the console command `mh key anthropic <key>` (a key typed in chat ends up in latest.log).
  # Falls back to the ANTHROPIC_API_KEY environment variable, then a .env file.
  apiKey: ""
  baseUrl: https://api.anthropic.com
  maxTokens: 32000

claude:
  # Path to the claude CLI. Empty = "claude" (or "claude.exe" on Windows). MH_CLAUDE_BIN also works.
  binary: ""
  # Stop the CLI when it prints nothing for this long
  idleTimeoutSeconds: 300
  # true: write the raw stream-json lines, process start/exit and stderr to
  # plugins/MinecraftHarness/logs/cli-stream.log (for finding why a request is slow or stuck).
  debugLog: false

mcp:
  # Local port of the tool server that the claude CLI connects to (127.0.0.1 only).
  # 0 = pick a free port each time the server starts.
  port: 0
