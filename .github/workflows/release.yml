name: Build & Release Plugin JAR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build PaperMC plugin JAR
        working-directory: plugin
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Type-check & build Bridge
        working-directory: bridge
        run: |
          npm ci
          npm run build

      - name: Publish GitHub Release with JAR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          JAR_PATH=$(ls plugin/build/libs/MinecraftHarness-*.jar | head -n 1)
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$JAR_PATH" --clobber
          else
            gh release create "$TAG_NAME" "$JAR_PATH" \
              --title "MinecraftHarness $TAG_NAME" \
              --generate-notes
          fi
