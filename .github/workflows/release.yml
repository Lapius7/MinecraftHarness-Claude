name: Build & Upload Draft Release JAR

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-draft
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-upload-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build PaperMC plugin JAR
        working-directory: plugin
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Type-check & build Bridge
        working-directory: bridge
        run: |
          npm ci
          npm run build

      - name: Upload plugin JAR to latest Draft GitHub Release (or create one)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node - <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");

          const token = process.env.GITHUB_TOKEN;
          const repo = process.env.GITHUB_REPOSITORY;
          const sha = (process.env.GITHUB_SHA || "").slice(0, 7);
          const apiBase = `https://api.github.com/repos/${repo}`;

          const libsDir = path.join("plugin", "build", "libs");
          const jarFile = fs.readdirSync(libsDir).find((f) => /^MinecraftHarness-.*\.jar$/.test(f));
          if (!jarFile) {
            throw new Error(`No MinecraftHarness-*.jar found in ${libsDir}`);
          }
          const jarPath = path.join(libsDir, jarFile);
          const jarBytes = fs.readFileSync(jarPath);
          console.log(`Built JAR: ${jarFile} (${jarBytes.length} bytes)`);

          const headers = {
            Authorization: `Bearer ${token}`,
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
            "User-Agent": "MinecraftHarness-CI",
          };

          async function ghJson(url, opts = {}) {
            const res = await fetch(url, {
              ...opts,
              headers: { ...headers, ...(opts.headers || {}) },
            });
            const text = await res.text();
            if (!res.ok) {
              throw new Error(`GitHub API ${res.status} on ${url}: ${text.slice(0, 400)}`);
            }
            return text ? JSON.parse(text) : null;
          }

          (async () => {
            const releases = await ghJson(`${apiBase}/releases?per_page=30`);
            let draft = releases.find((r) => r.draft === true);

            if (!draft) {
              // Pick next unused tag based on plugin/build.gradle.kts version (or increment patch if already published)
              const gradle = fs.readFileSync(path.join("plugin", "build.gradle.kts"), "utf8");
              const m = /version\s*=\s*"([^"]+)"/.exec(gradle);
              const baseVer = m ? m[1] : "0.1.0";
              const existingTags = new Set(releases.map((r) => r.tag_name).filter(Boolean));
              let tag = `v${baseVer}`;
              if (existingTags.has(tag)) {
                const parts = baseVer.split(".").map((n) => parseInt(n, 10));
                if (parts.length === 3 && parts.every(Number.isFinite)) {
                  let patch = parts[2] + 1;
                  while (existingTags.has(`v${parts[0]}.${parts[1]}.${patch}`)) patch++;
                  tag = `v${parts[0]}.${parts[1]}.${patch}`;
                } else {
                  tag = `v${baseVer}-draft`;
                }
              }

              console.log(`No existing draft release found. Creating draft release ${tag}...`);
              draft = await ghJson(`${apiBase}/releases`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  tag_name: tag,
                  target_commitish: "main",
                  name: `MinecraftHarness ${tag} (Draft)`,
                  body: `Automated CI draft build from commit \`${sha}\`.\n\n- Supports PaperMC / Purpur **1.21.0–1.21.x & 26.x**\n- Drop \`${jarFile}\` into your server \`plugins/\` folder.`,
                  draft: true,
                  prerelease: false,
                }),
              });
              console.log(`Created draft release id=${draft.id} (${draft.name})`);
            } else {
              console.log(`Found existing draft release id=${draft.id} (${draft.name || draft.tag_name})`);
              // Remove existing asset with the same filename so upload cleanly replaces it
              const assets = Array.isArray(draft.assets) ? draft.assets : [];
              for (const asset of assets) {
                if (/^MinecraftHarness-.*\.jar$/.test(asset.name)) {
                  console.log(`Replacing existing asset id=${asset.id} (${asset.name})...`);
                  await ghJson(`${apiBase}/releases/assets/${asset.id}`, { method: "DELETE" });
                }
              }
            }

            const uploadBase = String(draft.upload_url).replace(/\{[^}]*\}$/, "");
            const uploadUrl = `${uploadBase}?name=${encodeURIComponent(jarFile)}`;
            const uploaded = await ghJson(uploadUrl, {
              method: "POST",
              headers: {
                "Content-Type": "application/java-archive",
                "Content-Length": String(jarBytes.length),
              },
              body: jarBytes,
            });
            console.log(`Uploaded ${uploaded.name} (${uploaded.size} bytes) to draft release id=${draft.id}`);
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF
